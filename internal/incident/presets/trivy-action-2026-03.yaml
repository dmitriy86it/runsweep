id: trivy-action-2026-03
title: "aquasecurity/trivy-action and setup-trivy tags hijacked (CVE-2026-33634)"
# 75 trivy-action and 7 setup-trivy malicious commits. Full SHAs: StepSecurity (trivy-compromise-scanner
# internal/scanner/patterns.go, 82 SHAs) and Socket (75 trivy-action SHAs; the 7 setup-trivy SHAs from Socket's
# list as republished by Wiz). Each SHA was also checked on GitHub on 2026-10-08: the commit exists in the
# aquasecurity repository and its entrypoint.sh / action.yaml contains the payload (scan.aquasecurtiy.org, tpcp-docs).
# The advisory says 76 of 77 trivy-action tags; Wiz, Snyk and SafeDep say 75 of 76; both SHA lists have 75.
# This preset keeps those 75 trivy-action SHAs (+ 7 setup-trivy); the 76th tag has no published SHA in either list.
# start: 2026-03-19 ~17:43 UTC, earliest attacker activity (advisory GHSA-69fq-xp46-6x23, StepSecurity, Snyk).
# end: trivy-action tags restored ~05:40 UTC on 2026-03-20 (advisory, Snyk, Legit Security); widened to 06:00.
# setup-trivy alone was exposed until ~21:44 UTC on 2026-03-19, inside this window.
# Not covered: the trivy v0.69.4 binary and images (not an npm package or an action commit).
