name: ci
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: '17 4 * * 1'}]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}", cancel-in-progress: "${{ github.event_name == 'pull_request' }}"}
jobs:
  test:
    if: github.event_name != 'schedule' # the weekly run is for fuzzing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - run: go mod verify
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os != 'Linux'
        run: go test ./...
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: {version: v2.14.0}
  zizmor:
    # fork PRs get a read-only token: SARIF upload would fail
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with: {version: v1.30.1}
  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: ./internal/match/npm, target: FuzzParsePackageLock}
          - {pkg: ./internal/match/npm, target: FuzzParsePnpmLock}
          - {pkg: ./internal/match/npm, target: FuzzParseYarnLock}
          - {pkg: ./internal/workflow, target: FuzzWorkflowParse}
          - {pkg: ./internal/workflow, target: FuzzParseCall}
          - {pkg: ./internal/workflow, target: FuzzParseTokenPerms}
          - {pkg: ./internal/match/actions, target: FuzzMatchLog}
          - {pkg: ./internal/incident, target: FuzzIncidentParse}
          - {pkg: ./internal/report, target: FuzzClean}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod}
      - run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=30s -fuzzminimizetime=5s "$PKG"
        env: {PKG: '${{ matrix.pkg }}', TARGET: '${{ matrix.target }}'}
